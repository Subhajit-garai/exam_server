name: Worker Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "WSworker/**"

env:
  WSWORKER_IMAGE: ${{ secrets.WSWORKER_IMAGE }}
  DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}

